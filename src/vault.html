<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Capture Vault</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px -apple-system, Segoe UI, sans-serif; color: #0f2740; background: #f6f7f9; }
  header { background: #0f2740; color: #fff; padding: 12px 18px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; flex: 0 0 auto; }
  .pill { background: rgba(255,255,255,.12); border-radius: 20px; padding: 4px 11px; font-size: 12px; }
  .pill b { color: #7ee2a8; }
  .wrap { display: flex; height: calc(100vh - 108px); }
  .left { width: 46%; min-width: 380px; overflow: auto; border-right: 1px solid #e2e5ea; background: #fff; }
  .right { flex: 1; overflow: auto; padding: 14px 18px; }
  .bar { background: #fff; border-bottom: 1px solid #e2e5ea; padding: 9px 18px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input[type=text], select { padding: 6px 8px; border: 1px solid #d6dbe2; border-radius: 6px; font-size: 12px; }
  input[type=text] { flex: 1; min-width: 160px; }
  button { padding: 6px 11px; border: 0; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px; color: #fff; background: #374151; }
  button.p { background: #7c3aed; }
  button.g { background: #1a7f37; } button.b { background: #1f6feb; } button.r { background: #b42318; } button.ghost { background: #e5e7eb; color: #111827; }
  .row { padding: 9px 14px; border-bottom: 1px solid #eef0f3; cursor: pointer; display: flex; gap: 9px; align-items: flex-start; }
  .row:hover { background: #f2f7ff; }
  .row.sel { background: #e8f1ff; }
  .row .t { font-weight: 600; font-size: 12.5px; margin-bottom: 2px; word-break: break-word; }
  .row .u { color: #6b7280; font-size: 11px; word-break: break-all; }
  .row .m { color: #9ca3af; font-size: 10.5px; margin-top: 3px; }
  .tag { display: inline-block; background: #eef1f5; border-radius: 4px; padding: 0 5px; margin-right: 4px; font-size: 10px; color: #475569; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; }
  .tabs span { padding: 4px 9px; border-radius: 5px; background: #e5e7eb; cursor: pointer; font-size: 11.5px; }
  .tabs span.on { background: #0f2740; color: #fff; }
  pre { background: #0f172a; color: #e2e8f0; padding: 12px; border-radius: 8px; overflow: auto; max-height: calc(100vh - 240px); font: 11.5px ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-word; }
  .empty { padding: 40px 18px; color: #6b7280; text-align: center; }
  label.ck { font-size: 11.5px; margin-right: 9px; white-space: nowrap; }
</style>
</head>
<body>
<header>
  <h1>Adler Capture Vault</h1>
  <span class="pill"><b id="hCount">0</b> captures</span>
  <span class="pill"><b id="hBytes">0 KB</b> stored</span>
  <span class="pill" id="hRec">idle</span>
</header>

<div class="bar">
  <input type="text" id="q" placeholder="filter by title, url or host..." />
  <select id="host"><option value="">all sites</option></select>
  <select id="sess"><option value="">all sessions</option></select>
  <button class="ghost" id="all">Select all</button>
  <button class="ghost" id="none">Clear</button>
  <button class="r" id="del">Delete selected</button>
  <button class="r" id="wipe">Wipe vault</button>
</div>

<div class="bar">
  <b style="font-size:12px">Export:</b>
  <label class="ck"><input type="checkbox" class="lyr" value="text" checked /> text</label>
  <label class="ck"><input type="checkbox" class="lyr" value="links" checked /> links</label>
  <label class="ck"><input type="checkbox" class="lyr" value="assets" checked /> assets</label>
  <label class="ck"><input type="checkbox" class="lyr" value="structured" checked /> structured</label>
  <label class="ck"><input type="checkbox" class="lyr" value="forms" checked /> forms</label>
  <label class="ck"><input type="checkbox" class="lyr" value="tables" checked /> tables</label>
  <label class="ck"><input type="checkbox" class="lyr" value="repeats" checked /> repeats</label>
  <label class="ck"><input type="checkbox" class="lyr" value="cleanHtml" /> clean HTML</label>
  <label class="ck"><input type="checkbox" class="lyr" value="rawHtml" /> raw HTML</label>
  <button class="p" id="prep" title="Deduped, boilerplate stripped - roughly a tenth the tokens">Prep for Claude</button>
  <button class="g" id="md">.md raw</button>
  <button class="b" id="json">.json</button>
  <button id="csv">.csv</button>
  <button id="txt">.txt</button>
  <span id="tokenEst" style="font-size:11.5px;color:#475569;margin-left:4px"></span>
  <span id="exportStatus" style="font-size:11.5px;color:#92400e"></span>
</div>

<div class="wrap">
  <div class="left" id="list"><div class="empty">No captures yet. Hit &#8984;&#8679;S on any page.</div></div>
  <div class="right" id="detail"><div class="empty">Select a capture to inspect it before exporting.</div></div>
</div>

<script src="prep.js"></script>
<script src="vault.js"></script>
</body>
</html>
